[project]
name = "pixel-learning-api"
version = "0.1.0"
description = "FastAPI backend for the pixelized deep learning workbench"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "sqlalchemy>=2.0.38",
  "pydantic-settings>=2.10.1",
  "email-validator>=2.3.0",
  "python-multipart>=0.0.20",
  "pypdf>=5.9.0",
  "python-docx>=1.2.0"
]

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "httpx>=0.28.1"
]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
